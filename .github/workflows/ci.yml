name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  hono-gate:
    name: Hono gate / test / typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-vue/package-lock.json
      - run: npm ci
      - name: Hono API tests
        run: npm run test:hono
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm run test
      - name: Production build
        run: npm run build

  # Preview deploy. 実行には GitHub リポジトリに CLOUDFLARE_API_TOKEN secret
  # (権限: Workers Scripts / Pages / D1 / R2 の Edit / Account 290e65605de6f2b8a5f61dbfaa36e28c) が必要。
  # secret 未設定の間は deploy step のみスキップされ、test/build は自走する。
  deploy-preview:
    name: deploy preview (voice-bbs-web-vue) on master
    if: github.ref == 'refs/heads/master'
    needs: hono-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-vue
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "has_token=${{ env.CF_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-vue/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages (preview)
        if: steps.check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 290e65605de6f2b8a5f61dbfaa36e28c
          command: pages deploy dist --project-name voice-bbs-web-vue --branch main
